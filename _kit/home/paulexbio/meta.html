<title>Paulex Bio — regenerating the body's own beta cells</title>
<meta name="description" content="Paulex Bio, San Diego, is developing PAL-119, an investigational oral small molecule designed to regenerate insulin-producing beta cells and restore their response to glucose, for type 1 and type 2 diabetes. Now in a Phase 1/2a trial.">
