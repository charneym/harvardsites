<title>Plakous Therapeutics — human placental extract to protect premature babies from NEC</title>
<meta name="description" content="Plakous Therapeutics, Winston-Salem, North Carolina, is developing human placental extract (HPE), an orally delivered, cell-free biotherapeutic made from donated full-term placentas, to prevent necrotizing enterocolitis (NEC) in premature infants. Orphan drug and rare pediatric disease designations; NIH SBIR Phase IIB.">
