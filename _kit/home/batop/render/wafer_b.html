<!doctype html><html><head><meta charset="utf-8"><style>html,body{margin:0;background:#000}canvas{display:block}</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}</script></head><body>
<script type="module">
/* BATOP's own product: a 4-inch (100 mm) LT-GaAs wafer with customized metal structures (batop.de, Custom devices):
   a polished, dark single-crystal GaAs disc with its primary flat, a grid of dies each carrying gold photoconductive-antenna
   electrodes (a dipole gap between two striplines, bond pads), dicing streets and a bare edge ring. ?bg=#000|#fff */
import * as THREE from 'three';
const P=new URLSearchParams(location.search);const W=innerWidth,H=innerHeight;const BG=P.get('bg')||'#000';
const r=new THREE.WebGLRenderer({antialias:true,preserveDrawingBuffer:true});r.setPixelRatio(1);r.setSize(W,H);
r.toneMapping=THREE.ACESFilmicToneMapping;r.toneMappingExposure=+(P.get('ex')||1.0);r.outputColorSpace=THREE.SRGBColorSpace;document.body.appendChild(r.domElement);
const sc=new THREE.Scene();sc.background=new THREE.Color(BG);
/* TOP-FIX B 2026-11-27: neutral studio only. The key (the broad overhead panel and the strip) from the headline side (left),
   the former brand-blue panel is now a neutral grey bounce on the key side, a low neutral front fill, a dim rim far right */
const es=new THREE.Scene();es.background=new THREE.Color('#07090c');
function panel(w,h,col,int,pos,look){const m=new THREE.Mesh(new THREE.PlaneGeometry(w,h),new THREE.MeshBasicMaterial({color:new THREE.Color(col).multiplyScalar(int),side:THREE.DoubleSide}));m.position.set(...pos);m.lookAt(...look);es.add(m)}
panel(16,9,'#ffffff',+(P.get('pw')||1.3),[-5,13,-13],[0,0,0]);
panel(14,12,'#8c8c8c',+(P.get('pb')||1.6),[+(P.get('bx')||10),9,-12],[0,0,0]);
panel(6,3,'#d8d8d8',0.5,[-8,3,6],[0,0,0]);
panel(2.5,12,'#ffffff',0.6,[11,5,-11],[0,0,0]);
panel(2.2,26,'#ffffff',+(P.get('ps')||2.2),[+(P.get('sx')||-3),12,-12],[0,0,0]);
const pm=new THREE.PMREMGenerator(r);const env=pm.fromScene(es,0.04).texture;sc.environment=env;
/* texture maps, 4096 px over the 10-unit disc (radius 5) */
const T=4096,R=5,K=T/(2*R);
function cv(){const c=document.createElement('canvas');c.width=T;c.height=T;return c}
const col=cv(),met=cv(),rou=cv();const C=col.getContext('2d'),M=met.getContext('2d'),Ro=rou.getContext('2d');
C.fillStyle='#2b3036';C.fillRect(0,0,T,T);M.fillStyle='#e6e6e6';M.fillRect(0,0,T,T);Ro.fillStyle='#1a1a1a';Ro.fillRect(0,0,T,T);
const px=x=>(x+R)*K, py=y=>(R-y)*K;
const pitch=.62,die=.56,flatY=-4.75;
for(let i=-9;i<=9;i++)for(let j=-9;j<=9;j++){
  const cx=i*pitch,cy=j*pitch+.05;const hx=die/2;
  const far=Math.max(Math.hypot(cx-hx,cy-hx),Math.hypot(cx+hx,cy-hx),Math.hypot(cx-hx,cy+hx),Math.hypot(cx+hx,cy+hx));
  if(far>R-.32||cy-hx<flatY+.25)continue;
  /* the die: LT-GaAs film reads a touch bluer than the street */
  C.fillStyle='#46556a';C.fillRect(px(cx-hx),py(cy+hx),die*K,die*K);Ro.fillStyle='#2e2e2e';Ro.fillRect(px(cx-hx),py(cy+hx),die*K,die*K);
  /* gold: two striplines with a small dipole gap, and two bond pads */
  const g=(x0,y0,x1,y1)=>{for(const [ctx,v] of [[C,'#d9a948'],[M,'#ffffff'],[Ro,'#5a5a5a']]){ctx.fillStyle=v;ctx.fillRect(px(cx+x0),py(cy+y1),(x1-x0)*K,(y1-y0)*K)}};
  g(-.23,.12,-.07,.22);g(.07,.12,.23,.22);           /* bond pads */
  g(-.165,-.2,-.13,.12);g(.13,-.2,.165,.12);          /* striplines */
  g(-.13,-.035,-.012,-.005);g(.012,-.035,.13,-.005);  /* dipole arms and the gap */
  g(-.25,-.25,-.2,-.2);                               /* alignment mark */
}
/* the bare edge ring and the flat */
const cvs=[col,met,rou];
const tex=c=>{const t=new THREE.CanvasTexture(c);t.anisotropy=16;t.colorSpace=c===col?THREE.SRGBColorSpace:THREE.NoColorSpace;return t};
const mat=new THREE.MeshPhysicalMaterial({map:tex(col),metalnessMap:tex(met),roughnessMap:tex(rou),metalness:1,roughness:1,envMapIntensity:1.2});
/* wafer shape: circle with a primary flat */
const sh=new THREE.Shape();const a0=Math.acos(flatY/R);const N=400;
const ang0=-Math.PI/2+Math.acos(-flatY/R),ang1=-Math.PI/2-Math.acos(-flatY/R)+Math.PI*2;
for(let k=0;k<=N;k++){const a=ang0+(ang1-ang0)*k/N;const x=Math.cos(a)*R,y=Math.sin(a)*R;k?sh.lineTo(x,y):sh.moveTo(x,y)}
sh.closePath();
const geo=new THREE.ExtrudeGeometry(sh,{depth:.07,bevelEnabled:true,bevelThickness:.012,bevelSize:.012,bevelSegments:3,curveSegments:400});
/* planar UVs */
const uv=geo.attributes.uv,pos=geo.attributes.position;for(let k=0;k<pos.count;k++){uv.setXY(k,(pos.getX(k)+R)/(2*R),(pos.getY(k)+R)/(2*R))}
const edge=new THREE.MeshPhysicalMaterial({color:'#8a939c',metalness:.9,roughness:.25});
const m=new THREE.Mesh(geo,[mat,edge]);m.rotation.x=-Math.PI/2;sc.add(m);
const grp=new THREE.Group();sc.remove(m);grp.add(m);grp.rotation.y=+(P.get('ry')||-0.5);sc.add(grp);
const cam=new THREE.PerspectiveCamera(24,W/H,.1,200);const el=+(P.get('el')||0.78);const dist=30;
cam.position.set(0,Math.sin(el)*dist,Math.cos(el)*dist);cam.lookAt(0,-.2,0);
r.render(sc,cam);window.DONE=1;
</script></body></html>
