<script type="importmap">{"imports":{"three":"/three/build/three.module.js","three/addons/":"/three/examples/jsm/"}}</script></head><body>
<script type="module">
/* Unco Therapeutics hero: a crafted render of the subject of their science, a G protein-coupled receptor (GPCR) sitting in the
   cell membrane. Seven transmembrane alpha-helices (cartoon representation, coloured along the chain with the logo's sunset
   gradient: butter, peach, pink, lilac, violet), extracellular and intracellular loops, helix 8 along the inner leaflet,
   in a phospholipid bilayer patch. A small molecule (an allosteric uncoupler, ball-and-stick) sits in the intracellular
   G protein-binding pocket, as the NIH STTR abstract describes. Generic illustration, not a solved structure.
   Real alpha: the bilayer dissolves radially in-shader, so no cut edge exists (DJ, DP). */
import * as THREE from 'three';
import {RoomEnvironment} from 'three/addons/environments/RoomEnvironment.js';
const Q=new URLSearchParams(location.search);const W=+(Q.get('w')||1800),H=+(Q.get('h')||1440);
const r=new THREE.WebGLRenderer({antialias:true,alpha:true,preserveDrawingBuffer:true});r.setSize(W,H);r.setPixelRatio(1);
r.setClearColor(0x000000,0);r.toneMapping=THREE.ACESFilmicToneMapping;r.toneMappingExposure=+(Q.get('ex')||1.05);r.outputColorSpace=THREE.SRGBColorSpace;
document.body.appendChild(r.domElement);
const sc=new THREE.Scene();
const pm=new THREE.PMREMGenerator(r);sc.environment=pm.fromScene(new RoomEnvironment(),0.04).texture;sc.environmentIntensity=.35;
let seed=+(Q.get('seed')||11);const rnd=()=>{seed=(seed*16807)%2147483647;return (seed-1)/2147483646};
const V=(x,y,z)=>new THREE.Vector3(x,y,z);
/* sunset gradient from the logo sphere */
const GR=[0xfee391,0xfecaa0,0xfaaedd,0xd89bf6,0xa784ee,0x9273e4].map(c=>new THREE.Color(c));
function grad(t){t=Math.max(0,Math.min(1,t))*(GR.length-1);const i=Math.min(GR.length-2,Math.floor(t));return GR[i].clone().lerp(GR[i+1],t-i)}
const fres=(col,k)=>sh=>{sh.fragmentShader=sh.fragmentShader.replace('#include <opaque_fragment>','float fr=pow(1.0-clamp(abs(dot(normalize(normal),normalize(vViewPosition))),0.0,1.0),2.2);outgoingLight=outgoingLight*0.92+vec3('+col+')*fr*'+k+';\n#include <opaque_fragment>')};
/* ---- the receptor: 7 TM helix axes on a slightly irregular ring, tilted like a real bundle ---- */
const TOP=1.95,BOT=-1.95;
const ring=[[0,1.05],[ .95,.62],[1.05,-.35],[.45,-1.02],[-.45,-1.0],[-1.08,-.38],[-.92,.58]];
const tilt=[[.18,-.10],[-.12,.20],[.10,.22],[-.16,.08],[.20,-.12],[-.10,-.18],[.14,.16]];
const pts=[];const segT=[];/* the whole chain as one path: helix coils plus loops */
let chainLen=0;
function helixPts(a,b,flip){/* alpha helix: 3.6 residues/turn, pitch 0.54 (=5.4 A at 1u=10A), radius 0.23 */
  const ax=b.clone().sub(a),L=ax.length(),d=ax.clone().normalize();
  const u=new THREE.Vector3(1,0,0);if(Math.abs(d.x)>.9)u.set(0,0,1);const n1=u.clone().cross(d).normalize(),n2=d.clone().cross(n1);
  const out=[],steps=Math.round(L/0.54*24);
  for(let i=0;i<=steps;i++){const t=i/steps,ang=(flip?-1:1)*t*L/0.54*6.2832;const rv=n1.clone().multiplyScalar(Math.cos(ang)).addScaledVector(n2,Math.sin(ang));const p=a.clone().addScaledVector(d,t*L).addScaledVector(rv,.23);p.rv=rv;out.push(p)}
  return out}
const HX=[];
for(let k=0;k<7;k++){const [x,z]=ring[k],[tx,tz]=tilt[k];const up=k%2===0;/* TM1 goes in from outside (N-term out) */
  const lo=V(x-tx,BOT+(k%3)*.08,z-tz),hi=V(x+tx,TOP-(k%2)*.12,z+tz);HX.push(up?[hi,lo]:[lo,hi])}
/* extracellular N-terminus (PAR2 has a long tethered N-term): a short loose coil above */
const nterm=new THREE.CatmullRomCurve3([V(.2,3.15,1.7),V(.8,2.9,1.35),V(.35,2.55,1.05),V(-.15,2.35,1.15),HX[0][0].clone().add(V(0,.1,0))]).getPoints(60);
const chain=[...nterm];
for(let k=0;k<7;k++){const hp=helixPts(HX[k][0],HX[k][1],false);
  if(k>0){/* loop from end of previous helix to start of this one, bulging away from the membrane */
    const a=HX[k-1][1],b=HX[k][0],m=a.clone().add(b).multiplyScalar(.5),dir=Math.sign(a.y),c=m.clone();c.y+=dir*(k===4?.85:.55);c.x*=1.25;c.z*=1.25;
    const lp=new THREE.CatmullRomCurve3([a,a.clone().lerp(c,.5).add(V(0,dir*.25,0)),c,b.clone().lerp(c,.5).add(V(0,dir*.25,0)),b]).getPoints(44);chain.push(...lp.slice(1,-1))}
  chain.push(...hp)}
/* helix 8: amphipathic, lying along the inner leaflet after TM7 */
{const a=HX[6][1],c=V(-1.6,-2.15,1.25),b=V(-.1,-2.2,2.15);chain.push(...new THREE.CatmullRomCurve3([a,a.clone().lerp(c,.5).add(V(0,-.25,0)),c]).getPoints(30).slice(1));
 chain.push(...helixPts(c,b,false).slice(1));
 chain.push(...new THREE.CatmullRomCurve3([b,V(.35,-2.35,2.3),V(.7,-2.55,2.1)]).getPoints(14).slice(1))}
/* sweep: flat ribbon (cartoon) on helices, round coil on loops */
const NP=chain.length,wv=chain.map(p=>p.rv?1:0),ws=wv.map((_,i)=>{let a=0,n=0;for(let j=-6;j<=6;j++){const k=i+j;if(k>=0&&k<NP){a+=wv[k];n++}}return a/n});
const SEGS=18,pos=[],col=[],idx=[];let prevN=null;
for(let i=0;i<NP;i++){const p=chain[i],T=chain[Math.min(NP-1,i+1)].clone().sub(chain[Math.max(0,i-1)]).normalize();
  let Nn;if(p.rv)Nn=p.rv.clone();else if(prevN)Nn=prevN.clone();else Nn=V(1,0,0);
  Nn.addScaledVector(T,-Nn.dot(T)).normalize();prevN=Nn.clone();const B=T.clone().cross(Nn).normalize();
  const w=ws[i],aw=.07+.12*w,bt=.07-.028*w,c=grad(i/(NP-1));
  for(let j=0;j<SEGS;j++){const th=j/SEGS*6.2832,ca=Math.cos(th),sa=Math.sin(th);const sq=Math.sign(ca)*Math.pow(Math.abs(ca),.7);
    const q=p.clone().addScaledVector(B,sq*aw).addScaledVector(Nn,sa*bt);pos.push(q.x,q.y,q.z);col.push(c.r,c.g,c.b)}
  if(i>0)for(let j=0;j<SEGS;j++){const a=(i-1)*SEGS+j,b=(i-1)*SEGS+(j+1)%SEGS,c2=i*SEGS+j,d2=i*SEGS+(j+1)%SEGS;idx.push(a,c2,b,b,c2,d2)}}
const tg=new THREE.BufferGeometry();tg.setAttribute('position',new THREE.Float32BufferAttribute(pos,3));tg.setAttribute('color',new THREE.Float32BufferAttribute(col,3));tg.setIndex(idx);tg.computeVertexNormals();
const pm2=new THREE.MeshPhysicalMaterial({vertexColors:true,roughness:.38,metalness:0,clearcoat:.55,clearcoatRoughness:.3,sheen:.4,sheenColor:new THREE.Color(0xffe8f4),sheenRoughness:.5,side:THREE.DoubleSide});
pm2.onBeforeCompile=fres('1.0,0.85,0.95','0.45');
const REC=new THREE.Group();sc.add(REC);
REC.add(new THREE.Mesh(tg,pm2));
/* ---- the uncoupler: a small heterocyclic molecule in the intracellular pocket ---- */
{const g=new THREE.Group();const at=[],bd=[];
 function ringA(cx,cy,cz,n,r0,rot,el){const s=at.length;for(let i=0;i<n;i++){const a=rot+i/n*6.2832;at.push([cx+Math.cos(a)*r0,cy+Math.sin(a)*r0*.35,cz+Math.sin(a)*r0,el[i]||'C'])}for(let i=0;i<n;i++)bd.push([s+i,s+(i+1)%n]);return s}
 const r1=ringA(-.28,-1.55,.05,6,.25,0,['C','C','N','C','C','C']);
 const r2=ringA(.2,-1.62,-.06,5,.21,3.3,['C','S','C','N','C']);bd.push([r1+0,r2+0]);
 at.push([.62,-1.5,-.2,'O']);bd.push([r2+2,at.length-1]);at.push([-.75,-1.45,.25,'N']);bd.push([r1+3,at.length-1]);at.push([-1.0,-1.3,.05,'C']);bd.push([at.length-2,at.length-1]);
 const EC={C:0xfff1d0,N:0xa9b8ff,O:0xff9db8,S:0xffd36b};
 at.forEach(a=>{const m=new THREE.Mesh(new THREE.SphereGeometry(a[3]==='C'?.085:.1,32,24),new THREE.MeshPhysicalMaterial({color:EC[a[3]],roughness:.25,clearcoat:.8,emissive:EC[a[3]],emissiveIntensity:.18}));m.position.set(a[0],a[1],a[2]);g.add(m)});
 const bm=new THREE.MeshPhysicalMaterial({color:0xf4e6ff,roughness:.35,clearcoat:.6,emissive:0xfee391,emissiveIntensity:.08});
 bd.forEach(([i,j])=>{const A=V(at[i][0],at[i][1],at[i][2]),B=V(at[j][0],at[j][1],at[j][2]),L=A.distanceTo(B);const c=new THREE.Mesh(new THREE.CylinderGeometry(.028,.028,L,12),bm);c.position.copy(A).add(B).multiplyScalar(.5);c.quaternion.setFromUnitVectors(V(0,1,0),B.clone().sub(A).normalize());g.add(c)});
 g.scale.setScalar(1.6);g.position.set(.05,.55,.55);REC.add(g);
 const glow=new THREE.PointLight(0xfee391,3.5,2.6,1.6);glow.position.set(.1,-1.75,1.3);sc.add(glow)}
/* ---- lipid bilayer: phospholipid heads on two leaflets plus paired tails, dissolving radially ---- */
const RM=+(Q.get('rm')||4.4),HOLE=1.5;
const fadeMat=(m)=>{m.transparent=true;m.onBeforeCompile=sh=>{sh.vertexShader=sh.vertexShader.replace('#include <common>','#include <common>\nvarying vec3 vWp;').replace('#include <worldpos_vertex>','#include <worldpos_vertex>\nvec4 wpp=vec4(transformed,1.0);\n#ifdef USE_INSTANCING\nwpp=instanceMatrix*wpp;\n#endif\nvWp=(modelMatrix*wpp).xyz;');
  sh.fragmentShader=sh.fragmentShader.replace('#include <common>','#include <common>\nvarying vec3 vWp;').replace('#include <opaque_fragment>','float rr=length(vWp.xz);float ff=1.0-smoothstep('+(RM*.38).toFixed(2)+','+RM.toFixed(2)+',rr);ff=ff*ff*(3.0-2.0*ff);diffuseColor.a*=ff;\nfloat fr=pow(1.0-clamp(abs(dot(normalize(normal),normalize(vViewPosition))),0.0,1.0),2.0);outgoingLight=outgoingLight*0.9+vec3(0.62,0.55,1.0)*fr*0.35;\n#include <opaque_fragment>')};return m};
const heads=[];
for(const yl of [1.62,-1.62]){const P=[];let tries=0;while(tries<26000){tries++;const a=rnd()*6.2832,rr=Math.sqrt(rnd())*RM,x=Math.cos(a)*rr,z=Math.sin(a)*rr;
   if(Math.hypot(x*.95,z*.95)<HOLE||z>+(Q.get('cut')||.2))continue;let ok=true;for(const p of P)if((p[0]-x)**2+(p[1]-z)**2<.074){ok=false;break}if(ok)P.push([x,z])}
  P.forEach(p=>heads.push([p[0],yl+(rnd()-.5)*.06,p[1],Math.sign(yl)]))}
const hg=new THREE.SphereGeometry(.125,24,18);
const hm=fadeMat(new THREE.MeshPhysicalMaterial({color:0x3d3f8c,roughness:.42,clearcoat:.5,clearcoatRoughness:.35,sheen:.6,sheenColor:new THREE.Color(0xb7a6ff)}));
const HI=new THREE.InstancedMesh(hg,hm,heads.length);const M=new THREE.Matrix4();
heads.forEach((h,i)=>{M.makeTranslation(h[0],h[1],h[2]);HI.setMatrixAt(i,M);HI.setColorAt(i,new THREE.Color(0x3d3f8c).lerp(new THREE.Color(0x6a5fd0),rnd()*.45))});sc.add(HI);
/* tails: two slightly kinked chains per head, pointing to the membrane centre */
const tgeo=new THREE.CylinderGeometry(.022,.018,1,8,1);tgeo.translate(0,-.5,0);
const tm=fadeMat(new THREE.MeshPhysicalMaterial({color:0x26286a,roughness:.6}));
const TI=new THREE.InstancedMesh(tgeo,tm,heads.length*4);let ti=0;const q=new THREE.Quaternion(),sv=V(1,1,1);
heads.forEach(h=>{for(const off of [-.045,.045]){const base=V(h[0]+off,h[1]-h[3]*.1,h[2]+off*.6);
  const k1=V((rnd()-.5)*.25,-h[3],(rnd()-.5)*.25).normalize(),L1=.62;q.setFromUnitVectors(V(0,1,0),k1.clone().negate());sv.set(1,L1,1);M.compose(base,q,sv);TI.setMatrixAt(ti++,M);
  const b2=base.clone().addScaledVector(k1,L1),k2=V((rnd()-.5)*.5,-h[3],(rnd()-.5)*.5).normalize();q.setFromUnitVectors(V(0,1,0),k2.clone().negate());sv.set(1,.62,1);M.compose(b2,q,sv);TI.setMatrixAt(ti++,M)}});
sc.add(TI);
/* lighting: warm key (the logo's sunrise) from upper left, lilac rim behind */
const key=new THREE.DirectionalLight(0xfff0dc,2.1);key.position.set(-4,5,6);sc.add(key);
const fill=new THREE.DirectionalLight(0x8f86ff,.7);fill.position.set(5,-1,4);sc.add(fill);
const rim=new THREE.DirectionalLight(0xe1c4ff,2.0);rim.position.set(2,3,-6);sc.add(rim);
sc.add(new THREE.HemisphereLight(0x4c4a9c,0x02031c,.55));
const cam=new THREE.PerspectiveCamera(+(Q.get('fov')||28),W/H,.1,80);cam.position.set(+(Q.get('cx')||0),+(Q.get('cy')||5.2),+(Q.get('cz')||13.5));cam.lookAt(0,+(Q.get('ly')||-.1),0);
REC.rotation.y=+(Q.get('ry')||-.35);
r.render(sc,cam);window.DONE=true;
</script></body></html>
