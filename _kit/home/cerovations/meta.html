<title>Cerovations — the OsmoFlo™ Bimodal EVD System for severe traumatic brain injury</title>
<meta name="description" content="Cerovations, a Minnesota medical device company, is developing the OsmoFlo Bimodal EVD System, designed to remove water from cerebrospinal fluid as vapour to reduce cerebral edema and intracranial pressure in severe traumatic brain injury. FDA Breakthrough Device designation; funded by the NIH SBIR programme.">
