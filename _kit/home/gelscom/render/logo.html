<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Roboto:wght@400;500&display=block" rel="stylesheet">
<style>html,body{margin:0;background:transparent}
.l{display:inline-block;padding:6px 10px 8px;font-family:'Cormorant Garamond',serif;line-height:1}
.w{font-size:var(--fs);font-weight:600;letter-spacing:.005em;white-space:nowrap;display:block}
.w .a{color:var(--c1)}.w .b{color:var(--c2)}
.d{display:block;font-family:Roboto,sans-serif;font-weight:400;font-size:calc(var(--fs)*.215);letter-spacing:.06em;color:var(--c3);margin-top:calc(var(--fs)*.02);padding-left:calc(var(--fs)*.04)}
</style></head><body><span class="l" id="L" style="--fs:120px;--c1:#eef2e8;--c2:#a9c45c;--c3:#c9d3c3"><span class="w"><span class="a">Gels</span><span class="b">com</span></span><span class="d">Novel solutions for health</span></span></body></html>
