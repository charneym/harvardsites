<title>Flowpoint Medical — an implantable, self-sealing needle guide for hemodialysis vascular access</title>
<meta name="description" content="Flowpoint Medical, Overland Park, Kansas, is developing an implantable vascular access device for hemodialysis: a 3D-printed titanium shell that guides the needle to the correct insertion point, and a titanium-nitride coated valve that stops bleeding when the needle is removed.">
