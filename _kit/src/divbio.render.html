<script type="module">
/* Hero render for Diversified Biotech: a Planet-Safe 100 mm PLA cell culture dish with culture medium and its lid leaning on the
   rim, after the company's own product photograph (divbio.com, CELL-1000). Clear PLA, phenol-red medium, studio light, on the page ink. */
import * as THREE from 'three';
import {RoomEnvironment} from 'three/addons/environments/RoomEnvironment.js';
const P=new URLSearchParams(location.search);
const W=+P.get('w')||1800,H=+P.get('h')||1300,BG=P.get('bg')||'#091723';
const r=new THREE.WebGLRenderer({antialias:true,alpha:false,preserveDrawingBuffer:true});
r.setPixelRatio(1);r.setSize(W,H);r.toneMapping=THREE.ACESFilmicToneMapping;r.toneMappingExposure=+P.get('exp')||1.0;
r.shadowMap.enabled=true;r.shadowMap.type=THREE.PCFSoftShadowMap;r.setClearColor(new THREE.Color(BG),1);
document.body.appendChild(r.domElement);
const sc=new THREE.Scene();sc.background=new THREE.Color(BG);
/* a dark studio: black surround with a few softbox strips, as product photographers light clear plastic on black */
const es=new THREE.Scene();es.background=new THREE.Color(0x050a10);
function box(w,h,x,y,z,i,c){const m=new THREE.Mesh(new THREE.PlaneGeometry(w,h),new THREE.MeshBasicMaterial({color:new THREE.Color(c||0xffffff).multiplyScalar(i),side:THREE.DoubleSide}));m.position.set(x,y,z);m.lookAt(0,0,0);es.add(m)}
box(6,1.2,0,6,0,+P.get('b1')||2.2);            /* overhead strip */
box(1.4,5,-6,2,1,+P.get('b2')||1.6);          /* left softbox */
box(1.2,4,5.5,1.5,-3,+P.get('b3')||2.4,0xcfe4ff);  /* cool back-right rim */
box(4,0.6,0,1.2,6,+P.get('b4')||.6);          /* low front card */
box(+P.get('b5w')||3.2,+P.get('b5h')||.9,-0.6,3.2,-5.2,+P.get('b5')||1.5); /* high back strip: the sheen across the medium */
const pm=new THREE.PMREMGenerator(r);sc.environment=pm.fromScene(es,0.02).texture;
sc.environmentIntensity=+P.get('ei')||1;
const cam=new THREE.PerspectiveCamera(+P.get('fov')||22,W/H,.1,100);
cam.position.set(+P.get('cx')||0.35,+P.get('cy')||2.05,+P.get('cz')||3.3);cam.lookAt(+P.get('tx')||-0.3,0.04,0);
/* clear PLA on black: a reflections-only surface (black body, additive), so only the studio strips and the edges light up, plus a whisper of body haze */
const pla=new THREE.MeshPhysicalMaterial({color:0x000000,roughness:+P.get('pr')||.035,metalness:0,ior:1.46,specularIntensity:1,clearcoat:1,clearcoatRoughness:.03,side:THREE.DoubleSide,transparent:true,blending:THREE.AdditiveBlending,depthWrite:false,envMapIntensity:+P.get('pe')||1.4});
const haze=new THREE.MeshBasicMaterial({color:0xcfe0ee,transparent:true,opacity:+P.get('hz')||.025,depthWrite:false,side:THREE.DoubleSide});
function lathe(pts,seg){return new THREE.LatheGeometry(pts.map(p=>new THREE.Vector2(p[0],p[1])),seg||256)}
/* base: 100 mm x 15 mm, wall ~0.8 mm, scaled 1 unit = 100 mm */
const base=new THREE.Mesh(lathe([[0,0],[0.488,0],[0.497,0.004],[0.5,0.012],[0.5,0.15],[0.4955,0.152],[0.492,0.15],[0.492,0.016],[0.486,0.011],[0,0.011]]),pla);
base.castShadow=true;base.renderOrder=2;sc.add(base);const bh=new THREE.Mesh(base.geometry,haze);bh.renderOrder=1;sc.add(bh);
/* medium: phenol-red culture medium, ~7 mm deep, meniscus at the wall */
/* medium shading: lighter where the medium is shallow at the centre of view, deeper at the wall (a radial map on the top face) */
const tc=document.createElement('canvas');tc.width=tc.height=512;const tx=tc.getContext('2d');
const tg=tx.createRadialGradient(256,256,0,256,256,256);tg.addColorStop(0,P.get('m0')||'#ffffff');tg.addColorStop(.7,P.get('m1')||'#f2d6de');tg.addColorStop(1,P.get('m2')||'#a6788a');tx.fillStyle=tg;tx.fillRect(0,0,512,512);
const mt=new THREE.CanvasTexture(tc);mt.colorSpace=THREE.SRGBColorSpace;
const med=new THREE.MeshPhysicalMaterial({map:mt,color:new THREE.Color(P.get('mc')||'#b3143f'),roughness:.05,metalness:0,ior:1.335,clearcoat:1,clearcoatRoughness:.015});
const mg=lathe([[0,0.0115],[0.4915,0.0115],[0.4915,0.084],[0.486,0.079],[0.47,0.0765],[0,0.0755]]);
{const pa=mg.attributes.position,uv=mg.attributes.uv;for(let i=0;i<pa.count;i++){uv.setXY(i,.5+pa.getX(i)/.984,.5+pa.getZ(i)/.984)}uv.needsUpdate=true}
const mm=new THREE.Mesh(mg,med);sc.add(mm);
/* lid: 106 mm across, skirt ~9 mm, with three vent ribs inside the top; leaning on the base rim */
const lid=new THREE.Group();
const lm=new THREE.Mesh(lathe([[0,0.098],[0.515,0.098],[0.522,0.094],[0.526,0.086],[0.526,0],[0.519,0],[0.519,0.088],[0.512,0.09],[0,0.09]]),pla);lm.castShadow=true;lm.renderOrder=4;lid.add(lm);const lh=new THREE.Mesh(lm.geometry,haze);lh.renderOrder=3;lid.add(lh);
for(let k=0;k<3;k++){const a=k*Math.PI*2/3+.4;const rb=new THREE.Mesh(new THREE.BoxGeometry(.018,.006,.006),pla);rb.position.set(Math.cos(a)*.505,.087,Math.sin(a)*.505);rb.rotation.y=-a;lid.add(rb)}
lid.rotation.z=+P.get('lt')||0.146;lid.rotation.y=+P.get('ly')||0;
lid.position.set(+P.get('lx')||-0.62,+P.get('lyy')||0.074,+P.get('lz')||0.12);

/* an opaque ground of the page ink (unlit, not tone-mapped) so the transmission pass sees the real page colour through the plastic */
const gr=new THREE.Mesh(new THREE.PlaneGeometry(40,40),new THREE.MeshBasicMaterial({color:new THREE.Color(BG),toneMapped:false}));gr.rotation.x=-Math.PI/2;gr.position.y=-0.002;sc.add(gr);
const bw=new THREE.Mesh(new THREE.PlaneGeometry(40,40),new THREE.MeshBasicMaterial({color:new THREE.Color(BG),toneMapped:false}));bw.position.set(0,0,-8);sc.add(bw);
const fl=new THREE.Mesh(new THREE.PlaneGeometry(20,20),new THREE.ShadowMaterial({opacity:+P.get('so')||0.35}));fl.rotation.x=-Math.PI/2;fl.position.y=-0.0005;fl.receiveShadow=true;sc.add(fl);
const key=new THREE.DirectionalLight(0xffffff,+P.get('kl')||2.2);key.position.set(-2.2,5,2.4);key.castShadow=true;key.shadow.mapSize.set(4096,4096);key.shadow.radius=16;key.shadow.blurSamples=25;
Object.assign(key.shadow.camera,{left:-2,right:2,top:2,bottom:-2,near:.5,far:15});key.shadow.bias=-0.0003;sc.add(key);
const rim=new THREE.DirectionalLight(0xbfdcff,+P.get('rl')||2.4);rim.position.set(2.5,1.4,-3.5);sc.add(rim);
const fill=new THREE.DirectionalLight(0xffffff,+P.get('fl')||.5);fill.position.set(3,2.5,2);sc.add(fill);
sc.rotation.y=+P.get('ry')||0;
r.render(sc,cam);
window.DONE=r.domElement.toDataURL('image/png');
