<title>Maguro Surgical — MagStone magnetic kidney stone removal, Mountain View, CA</title>
<meta name="description" content="Maguro Surgical is a Mountain View, California medtech company founded by urologists. Its MagStone System coats kidney stone fragments with a magnetic hydrogel so they can be retrieved on a magnetic wire during ureteroscopy: complete stone removal with fewer passes, faster procedures and less trauma.">
