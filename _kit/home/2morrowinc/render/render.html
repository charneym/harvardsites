<!doctype html><html><head><meta charset="utf-8"><style>
html,body{margin:0;background:transparent}
.stage{position:relative;width:1400px;height:1300px;perspective:2600px}
.ph{position:absolute;width:400px;height:860px;border-radius:64px;padding:14px;box-sizing:border-box;
 background:linear-gradient(150deg,#4a545b 0%,#1a1f23 22%,#0f1316 60%,#2c343a 100%);
 box-shadow:inset 0 0 0 1.6px rgba(255,255,255,.22),inset 0 0 0 5px #07090b,0 60px 90px -30px rgba(0,0,0,.65),0 20px 40px -18px rgba(0,0,0,.6);
 transform-style:preserve-3d}
.ph .scr{position:relative;width:100%;height:100%;border-radius:51px;overflow:hidden;background-size:100% 100%;background-position:0 0}
.ph .scr::before{content:"";position:absolute;left:50%;top:15px;width:15px;height:15px;margin-left:-7.5px;border-radius:50%;background:radial-gradient(circle at 40% 35%,#2a3a48 0,#06080a 55%);box-shadow:0 0 0 2px rgba(0,0,0,.85)}
.ph .scr::after{content:"";position:absolute;inset:0;background:linear-gradient(118deg,rgba(255,255,255,.16) 0%,rgba(255,255,255,.05) 30%,rgba(255,255,255,0) 46%);pointer-events:none}
.ph .b{position:absolute;right:-3px;width:4px;border-radius:0 3px 3px 0;background:linear-gradient(90deg,#20262a,#59636a)}
.ph .bl{position:absolute;left:-3px;width:4px;border-radius:3px 0 0 3px;background:linear-gradient(270deg,#20262a,#59636a)}
.p1{left:300px;top:190px;transform:rotateY(-24deg) rotateX(7deg) rotateZ(5deg) translateZ(80px)}
.p2{left:560px;top:80px;transform:rotateY(-24deg) rotateX(7deg) rotateZ(5deg) translateZ(-320px);filter:brightness(.72)}
</style></head><body><div class="stage" id="st">
<div class="ph p2"><div class="scr" style="background-image:url(scr_values.png)"></div><i class="bl" style="top:190px;height:58px"></i><i class="bl" style="top:262px;height:58px"></i><i class="b" style="top:230px;height:96px"></i></div>
<div class="ph p1"><div class="scr" style="background-image:url(scr_home.png)"></div><i class="bl" style="top:190px;height:58px"></i><i class="bl" style="top:262px;height:58px"></i><i class="b" style="top:230px;height:96px"></i></div>
</div></body></html>
