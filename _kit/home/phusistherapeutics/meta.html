<title>PHusis Therapeutics — PH-domain inhibitors for cancer, La Jolla</title>
<meta name="description" content="PHusis Therapeutics develops targeted small molecules that bind and block the pleckstrin homology (PH) domain of signalling proteins that drive cancer. Its lead, topical PHT-427, a dual AKT/PDK1 inhibitor, is being taken into a Phase IA trial in actinic keratosis with an NCI SBIR Phase II award.">
