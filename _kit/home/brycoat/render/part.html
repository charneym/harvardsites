<!doctype html><html><head><meta charset="utf-8"><style>html,body{margin:0;background:#000}canvas{display:block}</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}</script></head><body>
<script type="module">
/* BryCoat's own signature subject (the "PVD Coatings" slide on brycoat.com, slides1-770x376_c.jpg): a machined steel
   precision centre whose turned point is PVD-coated in metallic-gold titanium nitride, the shank left bare, polished steel.
   Generic, unbranded, schematic proportions. ?bg=#000|#fff */
import * as THREE from 'three';
const P=new URLSearchParams(location.search);const W=innerWidth,H=innerHeight;const BG=P.get('bg')||'#000';
const r=new THREE.WebGLRenderer({antialias:true,preserveDrawingBuffer:true});r.setPixelRatio(1);r.setSize(W,H);
r.toneMapping=THREE.ACESFilmicToneMapping;r.toneMappingExposure=+(P.get('ex')||1.0);r.outputColorSpace=THREE.SRGBColorSpace;document.body.appendChild(r.domElement);
const sc=new THREE.Scene();sc.background=new THREE.Color(BG);
/* studio: big soft key above-left, long white strip lights for the turned highlights, a royal-blue panel (BryCoat #0e1b8e) behind for a cool rim */
const es=new THREE.Scene();es.background=new THREE.Color('#05070f');
function gtex(){const c=document.createElement('canvas');c.width=256;c.height=256;const x=c.getContext('2d');const g=x.createLinearGradient(0,0,256,0);g.addColorStop(0,'#fff');g.addColorStop(.45,'#ddd');g.addColorStop(.8,'#555');g.addColorStop(1,'#000');x.fillStyle=g;x.fillRect(0,0,256,256);const t=new THREE.CanvasTexture(c);t.colorSpace=THREE.SRGBColorSpace;return t}
function panel(w,h,col,int,pos,gr){const m=new THREE.Mesh(new THREE.PlaneGeometry(w,h),new THREE.MeshBasicMaterial({color:new THREE.Color(col).multiplyScalar(int),side:THREE.DoubleSide,map:gr?gtex():null}));m.position.set(...pos);m.lookAt(0,0,0);es.add(m)}
panel(16,10,'#ffffff',+(P.get('pw')||1.5),[-7,12,7]);
panel(14,12,'#2a3cff',+(P.get('pb')||0.9),[10,2,-10]);
panel(2,26,'#ffffff',+(P.get('ps')||2.4),[-12,4,-5]);
panel(26,1.6,'#ffffff',+(P.get('ph')||2.4),[0,10,4]);
panel(2,20,'#e8eef8',+(P.get('pr')||1.4),[12,4,6]);
panel(18,7,'#f4f6f8',+(P.get('pt')||1.1),[-2,9,-13],1);
panel(16,6,'#7d8aa8',0.35,[0,-10,4]);
panel(10,8,'#fff6e6',+(P.get('pg')||1.3),[9,10,8],1);
panel(22,8,'#ffffff',+(P.get('pf')||0.8),[0,-2,14],1);
panel(1.6,16,'#ffffff',+(P.get('pv')||2.0),[-7,3,10]);
panel(12,9,'#eef3f8',+(P.get('pl')||0.9),[-10,-3,6],1);
const pm=new THREE.PMREMGenerator(r);sc.environment=pm.fromScene(es,0.03).texture;
/* turning marks: roughness varies along the profile (v), constant around (u) */
function ntex(a,b,sz,rx,ry){const c=document.createElement('canvas');c.width=c.height=sz;const x=c.getContext('2d');const d=x.createImageData(sz,sz);
  for(let j=0;j<sz;j++){const row=a+Math.random()*(b-a);for(let i=0;i<sz;i++){const k=(j*sz+i)*4;const v=row*.85+.15*(a+Math.random()*(b-a));d.data[k]=d.data[k+1]=d.data[k+2]=v;d.data[k+3]=255}}
  x.putImageData(d,0,0);const t=new THREE.CanvasTexture(c);t.wrapS=t.wrapT=THREE.RepeatWrapping;t.repeat.set(rx||1,ry||8);return t}
const steel=new THREE.MeshPhysicalMaterial({color:'#dfe3e8',metalness:1,roughness:+(P.get('sr')||0.2),roughnessMap:ntex(120,230,512,1,10),envMapIntensity:1.15});
const gold=new THREE.MeshPhysicalMaterial({color:new THREE.Color(P.get('gc')||'#e9c066'),metalness:1,roughness:+(P.get('gr')||0.22),roughnessMap:ntex(130,225,512,1,14),envMapIntensity:1.2});
const dl=new THREE.DirectionalLight('#ffffff',+(P.get('dk')||1.4));dl.position.set(-4,8,6);sc.add(dl);
const fl=new THREE.DirectionalLight('#5b6cff',+(P.get('db')||0.5));fl.position.set(6,2,-5);sc.add(fl);
sc.add(new THREE.AmbientLight('#a9b4c0',0.14));
function lathe(pts,mat,seg=220){const g=new THREE.LatheGeometry(pts.map(p=>new THREE.Vector2(p[0],p[1])),seg);return new THREE.Mesh(g,mat)}
const grp=new THREE.Group();
/* bare steel shank with a chamfered back end and a relief groove (y = 0 .. 3.1) */
const R=.3;
grp.add(lathe([[0,0],[R-.04,0],[R,.04],[R,1.9],[R-.018,1.94],[R-.018,2.02],[R,2.06],[R,3.1]],steel));
/* the coated head: TiN over the turned body, collar and 60-degree point */
const T=.004;const RC=.47,y0=3.1;
const cone=RC/Math.tan(Math.PI/6);
grp.add(lathe([[0,y0-.001],[R+T,y0-.001],[R+T,y0+.32],[R+.03,y0+.35],[RC-.03,y0+.35],[RC,y0+.38],[RC,y0+.62],[RC-.02,y0+.64],[.012,y0+.64+cone-.02],[0,y0+.64+cone]],gold));
grp.position.y=-(y0+.64+cone)/2;
const g2=new THREE.Group();g2.add(grp);
g2.rotation.order='YXZ';g2.rotation.y=+(P.get('ry')||0.5);g2.rotation.x=+(P.get('rx')||0.35);g2.rotation.z=+(P.get('rz')||-0.95);sc.add(g2);
const cam=new THREE.PerspectiveCamera(+(P.get('fov')||22),W/H,.1,200);const el=+(P.get('el')||0.25);const dist=+(P.get('d')||14);
cam.position.set(0,Math.sin(el)*dist,Math.cos(el)*dist);cam.lookAt(0,0,0);
r.render(sc,cam);window.DONE=1;
</script></body></html>
