<title>PETcoil — a removable PET insert for simultaneous PET/MRI, Sunnyvale</title>
<meta name="description" content="PETcoil is developing a portable, brain-dedicated time-of-flight PET insert that slides into an existing MRI scanner, for simultaneous PET/MRI without a dedicated integrated system. Rooted in Stanford University research; Sunnyvale, California.">
