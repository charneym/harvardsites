<title>Parion Sciences — Inhaled ENaC blockers that restore the lung’s mucosal defense</title>
<meta name="description" content="Parion Sciences, Durham, North Carolina, develops inhaled therapies that restore the innate mucosal defense of the lung. Its lead, idrevloride (P-1037), an epithelial sodium channel (ENaC) blocker in hypertonic saline, improved lung function in the Phase 2 CLEAN-PCD study in primary ciliary dyskinesia.">
