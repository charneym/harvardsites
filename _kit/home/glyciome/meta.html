<title>Glyciome — Prebiotic genital care for cervical cancer prevention, Spokane, WA</title>
<meta name="description" content="Glyciome is a women-owned bioscience company in Spokane, Washington, developing prebiotic medical devices and personal care that support a healthy genital ecosystem. Its lead product, PreBioGyn, is a preservative-free prebiotic gel in development under an NCI Phase II award to prevent bacterial vaginosis, a risk factor for cervical cancer.">
