<title>Camino Pharma — first-in-class mGlu2 medicines for addiction and depression</title>
<meta name="description" content="Camino Pharma, San Diego, is a clinical-stage biotechnology company developing first-in-class small molecules that modulate the mGlu2 receptor, for substance use disorders and treatment-resistant depression. Its lead, SBP-9330, is Phase 2-ready.">
