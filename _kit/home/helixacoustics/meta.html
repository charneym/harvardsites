<title>Helix Acoustics — focused ultrasound for rapid DNA extraction</title>
<meta name="description" content="Helix Acoustics, Roanoke, Virginia, is developing a benchtop focused ultrasound transducer array that uses acoustic cavitation to break down tough tissue and release high-quality DNA, replacing multi-step chemical sample preparation. Supported by an NSF STTR Phase I award.">
