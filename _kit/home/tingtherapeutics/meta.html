<title>Ting Therapeutics — Small molecules to prevent and treat hearing loss, San Diego, CA</title>
<meta name="description" content="Ting Therapeutics is a San Diego biotechnology company developing novel and repurposed small molecules to prevent and treat hearing loss and other treatment-related tissue injuries. Its lead candidate TT004, a potential chemoprotective therapy for patients receiving cisplatin, is advancing into a Phase Ib trial.">
