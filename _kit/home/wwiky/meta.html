<title>WWiKY BioSciences — Hypoxia theranostics for solid tumours, Edmonton, AB</title>
<meta name="description" content="WWiKY BioSciences is an Edmonton, Alberta company developing hypoxia-selective theranostics: radiopharmaceuticals that image oxygen-deprived, therapy-resistant regions of solid tumours by PET or SPECT and then treat them with the same drug. Hypoxycin-1™ is approved by Health Canada for a Phase I/II clinical trial.">
