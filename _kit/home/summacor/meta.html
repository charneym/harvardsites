<title>SummaCor — the new pulse in cardiac support</title>
<meta name="description" content="SummaCor, San Diego, is developing the LCAPP (Linear Cardiac Assist Pulsatile Pump): a percutaneous, ECG-gated pulsatile pump placed in the descending aorta that unloads the heart without crossing the aortic valve, allowing time for cardiac recovery.">
