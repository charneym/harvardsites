<title>Peripear — warmth at birth, to prevent perineal tearing</title>
<meta name="description" content="Peripear, Oxford, is developing a wearable device, created by a midwife, that gives consistent, gentle warmth to the perineum during the second stage of labour, putting the clinical evidence for warm compresses into everyday practice to reduce perineal tearing.">
