<title>RespireRx Pharmaceuticals — GABAkines and AMPAkines for disorders of neuronal signalling, Glen Rock, NJ</title>
<meta name="description" content="RespireRx Pharmaceuticals Inc. (Glen Rock, New Jersey) develops neuromodulators for disorders caused by disrupted neuronal signalling: KRM-II-81, a selective GABAkine for epilepsy and pain, funded by an NIH/NINDS SBIR Phase II award; the AMPAkines CX717 and CX1739 for ADHD, spinal cord injury and breathing disorders; and dronabinol for obstructive sleep apnea.">
