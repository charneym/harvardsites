<title>Everglades Biopharma — disease-targeted anti-angiogenic therapy for the retina, Houston, Texas</title>
<meta name="description" content="Everglades Biopharma is a Houston, Texas biopharmaceutical company developing ligand-based therapies. Its lead programme is a humanized antibody against secretogranin III, an angiogenic factor that binds diseased but not healthy vessels, for diabetic retinopathy and wet age-related macular degeneration.">
