<title>Mitovation — Near-infrared light to protect the brain after cardiac arrest, stroke and brain injury, Ann Arbor, MI</title>
<meta name="description" content="Mitovation, in Ann Arbor, Michigan, is developing a non-invasive medical device that delivers inhibitory wavelengths of near-infrared light to prevent ischemia-reperfusion injury of the brain after cardiac arrest, stroke, traumatic brain injury and neonatal hypoxia-ischemia. Investigational device.">
