<title>Bedrock Therapeutics — AAV gene therapy for local immune privilege, Chapel Hill, NC</title>
<meta name="description" content="Bedrock Therapeutics is a Chapel Hill, North Carolina gene therapy company developing engineered AAV capsids and single-chain immune modulators (scIMs). Its lead programme, BDRK-401, is a single-dose ex vivo gene therapy that protects donor corneas from rejection in high-risk corneal transplantation.">
