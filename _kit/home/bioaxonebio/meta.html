<title>BioAxone BioSciences — drugs to restore neurological function</title>
<meta name="description" content="BioAxone BioSciences, Boston, develops drugs that act on Rho signalling to repair the injured spinal cord and protect the blood-brain barrier: BA-210 for acute spinal cord injury, NRL-1049 (licensed to Neurelis) for cerebral cavernous malformation, and BA-434 for axon regeneration.">
