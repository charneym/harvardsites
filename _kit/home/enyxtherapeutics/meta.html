<title>Enyx Therapeutics — in vivo gene therapy for hereditary disorders, New York</title>
<meta name="description" content="Enyx Therapeutics is an early-stage New York biotechnology company using in vivo gene therapy to treat hereditary disorders of unmet medical need. Its lead, ENX03, is a one-time AAV gene therapy for the bone loss of ALDH2 deficiency, funded by an NIH STTR Phase II award.">
