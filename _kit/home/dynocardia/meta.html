<title>Dynocardia — ViTrack continuous, cuff-less blood pressure monitoring</title>
<meta name="description" content="Dynocardia, Inc. develops ViTrack, a wrist-worn, cuff-less monitor that measures systolic and diastolic blood pressure continuously, beat to beat, with an optomechanical sensor over the radial artery. Founded with support from MIT and Tufts; NIH- and NSF-funded; Newton, Massachusetts.">
